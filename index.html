<!doctype html><html lang="en"><head><meta charset="utf-8">

<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">

<title>X Monitor</title><style>
@font-face{font-family:Inter;src:url(fonts/inter-latin-wght-normal.woff2) format('woff2');font-weight:100 900;font-display:swap}
@font-face{font-family:Outfit;src:url(fonts/outfit-latin-wght-normal.woff2) format('woff2');font-weight:100 900;font-display:swap}
:root{--bg:#0b0a12;--card:rgba(255,255,255,.045);--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.14);--lav:#c9b6f5;--blue:#a9c8f0;--mint:#7ef0b0;--gold:#f3d38a;--danger:#f08a8a;--text:#f5f2fb;--mute:#9d96b0;--dim:#6c6580;
--chrome:linear-gradient(135deg,#fafbfd 0%,#a7adb9 38%,#eef0f4 55%,#7b8190 80%,#d9dce3 100%);--ease:cubic-bezier(.22,.9,.3,1);--head:Outfit,Inter,-apple-system,sans-serif;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0}
html,body{overflow-x:hidden;background:var(--bg);color:var(--text);font:15px/1.42 Inter,-apple-system,sans-serif;overscroll-behavior-y:contain;-webkit-font-smoothing:antialiased}
body:before{content:"";position:fixed;inset:-20%;z-index:-1;background:radial-gradient(60% 40% at 20% 0%,rgba(122,96,200,.28),transparent 60%),radial-gradient(50% 35% at 100% 30%,rgba(80,130,200,.16),transparent 60%),radial-gradient(60% 40% at 50% 110%,rgba(60,200,150,.08),transparent 60%)}
header{position:sticky;top:0;z-index:20;padding:calc(var(--sat) + 10px) 20px 10px;display:flex;justify-content:space-between;align-items:center;background:linear-gradient(rgba(11,10,18,.92),rgba(11,10,18,.6));backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px)}
.brand{display:flex;gap:10px;align-items:center}.logo{width:34px;height:34px;border-radius:11px;background:var(--chrome);display:grid;place-items:center;box-shadow:0 0 18px rgba(201,182,245,.35)}
h1{font:700 22px var(--head);letter-spacing:-.3px}.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.chromet{background:var(--chrome);-webkit-background-clip:text;background-clip:text;color:transparent}
.live{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--mint);padding:6px 10px;border-radius:99px;background:rgba(126,240,176,.08);border:1px solid rgba(126,240,176,.2)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--mint);box-shadow:0 0 10px var(--mint);animation:bl 1.6s infinite}@keyframes bl{50%{opacity:.35}}
main{padding:4px 16px calc(var(--sab) + 104px)}section{display:none;animation:in .45s var(--ease)}section.on{display:block}@keyframes in{from{opacity:0;transform:translateY(10px)}}
#ptr{height:0;overflow:hidden;text-align:center;color:var(--mute);font-size:12px;line-height:40px;transition:height .25s var(--ease)}
.glass{background:linear-gradient(160deg,rgba(255,255,255,.07),rgba(255,255,255,.02));border:1px solid var(--line);border-radius:22px;padding:16px;margin-bottom:12px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 10px 30px rgba(0,0,0,.25)}
.h2{font:600 17px var(--head);margin:18px 4px 10px;display:flex;justify-content:space-between;align-items:baseline}.h2 small{font:500 12px Inter;color:var(--mute)}
.mu{color:var(--mute);font-size:12px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.radarwrap{position:relative;margin:4px auto 6px;aspect-ratio:1;max-width:400px}canvas#rad{width:100%;height:100%;display:block}
.rlegend{position:absolute;left:0;right:0;bottom:-2px;display:flex;justify-content:center;gap:14px;font-size:11px;color:var(--mute)}.rlegend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:middle}
.strip{display:grid;grid-template-columns:repeat(3,1fr);gap:0;padding:12px 6px}.strip>div{text-align:center;border-left:1px solid var(--line)}.strip>div:first-child{border:0}.strip b{display:block;font:600 17px var(--head);font-variant-numeric:tabular-nums}
.car{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:2px 16px 6px;scrollbar-width:none}.car::-webkit-scrollbar{display:none}
.hc{flex:0 0 150px;scroll-snap-align:start;margin:0;padding:14px;transition:transform .2s var(--ease)}.hc:active,.press:active{transform:scale(.96)}
.tk{font:700 17px var(--head)}.badge{font:800 13px var(--head);padding:5px 9px;border-radius:10px;color:#141019}
.hero{position:relative;overflow:hidden;border-radius:26px;padding:20px;margin:8px 0 12px;background:linear-gradient(140deg,#33265c,#1c1433 60%,#14202a);border:1px solid rgba(243,211,138,.28);box-shadow:0 0 40px rgba(243,211,138,.12)}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.09) 50%,transparent 70%);transform:translateX(-100%);animation:sh 4s infinite}@keyframes sh{60%,100%{transform:translateX(100%)}}
.hero .big{font:700 34px var(--head);letter-spacing:-.5px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}.kv{background:rgba(0,0,0,.22);border:1px solid var(--line);border-radius:14px;padding:9px 11px}.kv b{display:block;font:600 16px var(--head);font-variant-numeric:tabular-nums}
.ca{font:12px ui-monospace,Menlo,monospace;color:#d6d2e4;background:rgba(0,0,0,.28);border:1px dashed var(--line2);border-radius:12px;padding:10px 12px;word-break:break-all;margin-top:10px;display:flex;gap:8px;justify-content:space-between;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.chip{font-size:11px;font-weight:600;padding:4px 9px;border-radius:99px;border:1px solid var(--line2);color:var(--mute)}.chip.ok{color:var(--mint);border-color:rgba(126,240,176,.3);background:rgba(126,240,176,.06)}.chip.bad{color:var(--danger);border-color:rgba(240,138,138,.3)}.chip.gold{color:var(--gold);border-color:rgba(243,211,138,.35)}.chip.lav{color:var(--lav);border-color:rgba(201,182,245,.35)}.chip.blue{color:var(--blue);border-color:rgba(169,200,240,.3)}
.btns{display:flex;gap:8px;margin-top:6px}.btn{flex:1;text-align:center;text-decoration:none;color:var(--text);padding:12px;border-radius:14px;background:rgba(255,255,255,.06);border:1px solid var(--line2);font-weight:600;font-size:13px;transition:transform .15s}.btn.pri{background:var(--chrome);color:#15121c;border:0}
.tl{position:relative;padding-left:22px}.tl:before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:2px;background:linear-gradient(var(--lav),transparent)}
.ti{position:relative;margin-bottom:10px}.ti:before{content:"";position:absolute;left:-20px;top:18px;width:12px;height:12px;border-radius:50%;background:var(--bg);border:2px solid var(--lav);box-shadow:0 0 10px rgba(201,182,245,.5)}.ti.hit:before{border-color:var(--gold);box-shadow:0 0 12px var(--gold)}
.nm{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-top:1px solid var(--line);font-size:12.5px}.mono{font-family:ui-monospace,Menlo,monospace}
.big2{font:700 32px var(--head)}.bar{height:8px;border-radius:9px;background:rgba(0,0,0,.3);overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:var(--chrome);border-radius:9px;transition:width 1s var(--ease)}
.chart{display:flex;align-items:flex-end;gap:6px;height:120px;margin-top:12px}.chart .c{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:3px;height:100%}.chart .c i{width:100%;border-radius:6px 6px 3px 3px;animation:gr .9s var(--ease) both}@keyframes gr{from{transform:scaleY(0);transform-origin:bottom}}
.acc{display:flex;align-items:center;gap:12px;padding:11px 2px;border-top:1px solid var(--line);color:var(--text);text-decoration:none}.acc:first-child{border:0}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font:700 14px var(--head);color:#15121c;flex:0 0 40px}
nav{position:fixed;z-index:30;left:50%;transform:translateX(-50%);bottom:calc(var(--sab) + 12px);display:flex;gap:2px;padding:6px;background:rgba(26,21,38,.78);backdrop-filter:blur(26px) saturate(1.4);-webkit-backdrop-filter:blur(26px) saturate(1.4);border:1px solid var(--line2);border-radius:99px;box-shadow:0 12px 40px rgba(0,0,0,.5)}
nav button{position:relative;background:none;border:0;color:var(--mute);font:600 11px Inter;padding:9px 16px;border-radius:99px;display:flex;align-items:center;gap:6px;transition:all .35s var(--ease)}nav button svg{width:20px;height:20px}nav button span{max-width:0;overflow:hidden;transition:max-width .35s var(--ease)}
nav button.on{color:#15121c;background:var(--chrome);box-shadow:0 0 16px rgba(201,182,245,.35)}nav button.on span{max-width:80px}
#scrim{position:fixed;inset:0;z-index:40;background:rgba(5,4,10,.55);opacity:0;pointer-events:none;transition:opacity .3s}#scrim.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;z-index:41;left:0;right:0;bottom:0;max-height:88vh;overflow:auto;padding:10px 18px calc(var(--sab) + 22px);background:linear-gradient(#1d1730,#120f1c);border-radius:28px 28px 0 0;border-top:1px solid var(--line2);transform:translateY(105%);transition:transform .45s var(--ease);box-shadow:0 -20px 60px rgba(0,0,0,.6)}#sheet.on{transform:none}
.grab{width:40px;height:5px;border-radius:9px;background:rgba(255,255,255,.2);margin:0 auto 14px}
#toast{position:fixed;z-index:60;left:50%;top:calc(var(--sat) + 64px);transform:translate(-50%,-10px);background:var(--chrome);color:#15121c;padding:9px 16px;border-radius:99px;font-weight:700;font-size:13px;opacity:0;transition:.3s var(--ease);pointer-events:none}#toast.on{opacity:1;transform:translate(-50%,0)}
.empty{text-align:center;color:var(--mute);padding:26px}
</style></head><body>
<header><div class="brand"><div class="logo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#15121c" stroke-width="2.6" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"/></svg></div><div><div class="eyebrow">Solana · X radar</div><h1 class="chromet" id="ttl">Radar</h1></div></div><div class="live"><span class="dot"></span>LIVE</div></header>
<div id="ptr">Pull to refresh</div>
<main>
<section id="s-radar"><div id="heroA"></div>
<div class="radarwrap"><canvas id="rad"></canvas><div class="rlegend"><span><i style="background:var(--gold)"></i>Alert</span><span><i style="background:var(--blue)"></i>Near miss</span><span>Center = newest</span></div></div>
<div class="glass strip"><div><span class="mu">Last scan</span><b id="sLast">—</b></div><div><span class="mu">Next scan</span><b id="sNext">—</b></div><div><span class="mu">X reads</span><b id="sReads">—</b></div></div>
<div class="h2">Hot now <small>tap for details</small></div><div class="car" id="hot"></div></section>
<section id="s-scans"></section><section id="s-watch"></section><section id="s-stats"></section>
</main>
<nav id="nav"></nav><div id="scrim"></div><div id="sheet"></div><div id="toast">Copied</div>
<script>
const TZ='Europe/Athens',$=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tabs=[['radar','Radar','<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.5"/><path d="M12 12l6-6"/>'],['scans','Scans','<path d="M3 12h4l2.5-7 5 14 2.5-7h4"/>'],['watch','Watchlist','<circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/>'],['stats','Stats','<path d="M5 20V11M12 20V4M19 20v-6"/>']];
let tab=location.hash.slice(1)||'radar',F=null,blips=[],hot=[];
const tm=t=>new Date(t*1000).toLocaleString('en-GB',{timeZone:TZ,day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}),hm=t=>new Date(t*1000).toLocaleTimeString('en-GB',{timeZone:TZ,hour:'2-digit',minute:'2-digit'});
const usd=n=>n==null?'—':'$'+(n>=1e6?(n/1e6).toFixed(2)+'M':n>=1e3?(n/1e3).toFixed(1)+'k':Math.round(n)),age=h=>h==null?'—':h<1?Math.round(h*60)+'m':h.toFixed(1)+'h';
const ago=t=>{const m=Math.max(0,(Date.now()/1e3-t)/60);return m<1?'now':m<60?Math.round(m)+'m ago':(m/60).toFixed(1)+'h ago'};
const short=c=>c?c.slice(0,4)+'…'+c.slice(-4):'—',col=s=>s>=8?'#7ef0b0':s>=6?'#f3d38a':s>=4?'#a9c8f0':'#f08a8a';
const hash=s=>{let h=2166136261;for(const c of String(s))h=Math.imul(h^c.charCodeAt(0),16777619);return(h>>>0)/4294967296};
const buzz=()=>navigator.vibrate&&navigator.vibrate(8);
nav.innerHTML=tabs.map(([k,l,p])=>`<button data-k="${k}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${p}</svg><span>${l}</span></button>`).join('');
nav.onclick=e=>{const b=e.target.closest('button');if(b&&b.dataset.k!=tab){buzz();tab=b.dataset.k;history.replaceState(0,'','#'+tab);show();scrollTo({top:0})}};
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),1300)}
function copy(ca){navigator.clipboard?.writeText(ca);buzz();toast('CA copied')}
/* ---------- data ---------- */
function build(){const now=Date.now()/1e3,m=new Map();
 for(const r of F.runs)for(const n of r.near_misses||[]){const k=n.ca||n.symbol;if(!k||m.has(k))continue;m.set(k,{kind:'miss',ca:n.ca,symbol:n.symbol,reason:n.reason,authors:n.authors||1,post:n.post,time:r.time,run:r.id})}
 for(const a of F.alerts)m.set(a.ca,{kind:'alert',...a,symbol:a.dex?.symbol,authors:(a.authors||[]).length});
 blips=[...m.values()].filter(b=>now-b.time<6*3600).map(b=>({...b,ang:hash(b.ca||b.symbol)*Math.PI*2,age:(now-b.time)/3600}));
 hot=[...m.values()].sort((a,b)=>(b.kind=='alert')-(a.kind=='alert')||(b.score||0)-(a.score||0)||b.authors-a.authors||b.time-a.time).slice(0,10)}
/* ---------- radar ---------- */
const cv=$('#rad'),cx=cv.getContext('2d');let W,R,sweep=0;
function size(){const r=cv.getBoundingClientRect(),d=devicePixelRatio||2;cv.width=r.width*d;cv.height=r.height*d;W=r.width;R=W/2-14;cx.setTransform(d,0,0,d,0,0)}
function pos(b){const rr=R*(0.14+0.84*Math.min(1,Math.sqrt(b.age/6)));return[W/2+Math.cos(b.ang)*rr,W/2+Math.sin(b.ang)*rr]}
function draw(t){if(tab!='radar'){requestAnimationFrame(draw);return}if(!W)size();const c=W/2;cx.clearRect(0,0,W,W);
 const g=cx.createRadialGradient(c,c,0,c,c,R);g.addColorStop(0,'rgba(120,100,200,.22)');g.addColorStop(.7,'rgba(40,30,70,.18)');g.addColorStop(1,'rgba(20,15,35,.05)');cx.fillStyle=g;cx.beginPath();cx.arc(c,c,R,0,7);cx.fill();
 cx.strokeStyle='rgba(220,215,240,.10)';cx.lineWidth=1;for(let i=1;i<=4;i++){cx.beginPath();cx.arc(c,c,R*i/4,0,7);cx.stroke()}
 cx.strokeStyle='rgba(220,215,240,.06)';for(let i=0;i<12;i++){const a=i*Math.PI/6;cx.beginPath();cx.moveTo(c,c);cx.lineTo(c+Math.cos(a)*R,c+Math.sin(a)*R);cx.stroke()}
 cx.strokeStyle='rgba(240,240,250,.5)';cx.lineWidth=1.5;cx.beginPath();cx.arc(c,c,R,0,7);cx.stroke();
 cx.fillStyle='rgba(157,150,176,.7)';cx.font='10px Inter';cx.textAlign='center';['1h','3h','6h'].forEach((l,i)=>cx.fillText(l,c+3,c-R*(0.14+0.84*Math.sqrt([1,3,6][i]/6))+12));
 sweep=(t/1000*0.9)%(Math.PI*2);
 if(cx.createConicGradient){const s=cx.createConicGradient(sweep-1.2,c,c);s.addColorStop(0,'rgba(201,182,245,0)');s.addColorStop(.19,'rgba(201,182,245,.28)');s.addColorStop(.191,'rgba(0,0,0,0)');cx.fillStyle=s;cx.beginPath();cx.moveTo(c,c);cx.arc(c,c,R,sweep-1.2,sweep);cx.fill()}
 cx.save();cx.shadowColor='#e8e0ff';cx.shadowBlur=12;cx.strokeStyle='rgba(245,242,251,.9)';cx.lineWidth=2;cx.beginPath();cx.moveTo(c,c);cx.lineTo(c+Math.cos(sweep)*R,c+Math.sin(sweep)*R);cx.stroke();cx.restore();
 for(const b of blips){const[x,y]=pos(b),fade=Math.max(.25,1-b.age/6);let d=((sweep-b.ang)%(Math.PI*2)+Math.PI*2)%(Math.PI*2),flash=Math.max(0,1-d/1.6);
  const al=b.kind=='alert',base=al?(b.score>=8?'126,240,176':'243,211,138'):(b.authors>=2?'169,200,240':'170,170,190'),r=al?6+(b.score||6)*.5:2.5+Math.min(b.authors,4);
  if(al){const p=(t/900)%1;cx.strokeStyle=`rgba(${base},${(1-p)*.8})`;cx.lineWidth=2;cx.beginPath();cx.arc(x,y,r+p*18,0,7);cx.stroke()}
  cx.save();cx.shadowColor=`rgba(${base},1)`;cx.shadowBlur=al?22:8+flash*12;cx.fillStyle=`rgba(${base},${al?1:fade*(.45+flash*.55)})`;cx.beginPath();cx.arc(x,y,r,0,7);cx.fill();cx.restore();
  if(al){cx.fillStyle='#f5f2fb';cx.font='600 11px Outfit,Inter';cx.fillText('$'+b.symbol,x,y-r-8)}}
 cx.fillStyle='#f5f2fb';cx.shadowColor='#fff';cx.shadowBlur=14;cx.beginPath();cx.arc(c,c,3.5,0,7);cx.fill();cx.shadowBlur=0;
 requestAnimationFrame(draw)}
cv.addEventListener('click',e=>{const r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;let best=null,bd=30;for(const b of blips){const[px,py]=pos(b),d=Math.hypot(px-x,py-y);if(d<bd){bd=d;best=b}}if(best)openSheet(best)});
addEventListener('resize',size);
/* ---------- sheet ---------- */
function openSheet(b){buzz();const d=b.dex||{},r=b.rug||{},al=b.kind=='alert',ca=b.ca||'';
 const flags=al?((r.risks||[]).map(x=>`<span class="chip bad">${esc(x)}</span>`).join('')||(r.reachable?'<span class="chip ok">✓ RugCheck clean</span>':'<span class="chip">RugCheck unreachable</span>'))+(r.mint_auth?'':'<span class="chip ok">Mint revoked</span>')+(r.freeze_auth?'':'<span class="chip ok">No freeze</span>'):`<span class="chip blue">Near miss</span><span class="chip">${esc(b.reason)}</span>`;
 $('#sheet').innerHTML=`<div class="grab"></div><div class="row"><div><div class="eyebrow">${al?'Alert · scan #'+b.run:'Seen · scan #'+b.run} · ${tm(b.time)}</div><div class="big2">${b.symbol?'$'+esc(b.symbol):esc(short(ca))}</div><div class="mu">${esc(d.name||'')}${d.dex?' · '+esc(d.dex):''}</div></div>${al?`<div class="badge" style="background:${col(b.score)};font-size:18px;padding:10px 13px">${b.score}<small style="font-size:11px">/10</small></div>`:''}</div>
 ${ca?`<div class="ca press" onclick="copy('${esc(ca)}')"><span>${esc(ca)}</span><b style="font-size:11px;color:var(--lav)">COPY</b></div>`:''}
 ${al?`<div class="grid"><div class="kv"><span class="mu">Liquidity</span><b>${usd(d.liq)}</b></div><div class="kv"><span class="mu">FDV</span><b>${usd(d.fdv)}</b></div><div class="kv"><span class="mu">Pair age</span><b>${age(d.age_h)}</b></div><div class="kv"><span class="mu">Vol 1h</span><b>${usd(d.vol_h1)}</b></div><div class="kv"><span class="mu">1h change</span><b style="color:${(d.chg_h1||0)>=0?'var(--mint)':'var(--danger)'}">${d.chg_h1!=null?(d.chg_h1>0?'+':'')+d.chg_h1+'%':'—'}</b></div><div class="kv"><span class="mu">Buys / sells 1h</span><b>${(d.buys_h1||0).toLocaleString()} / ${(d.sells_h1||0).toLocaleString()}</b></div></div>`:`<div class="grid"><div class="kv"><span class="mu">Callers</span><b>${b.authors}</b></div><div class="kv"><span class="mu">First seen</span><b>${ago(b.time)}</b></div></div>`}
 <div class="eyebrow" style="margin-top:6px">${al?'RugCheck':'Why dropped'}</div><div class="chips">${flags}</div>
 ${al&&b.authors?`<div class="eyebrow" style="margin-top:6px">Callers</div><div class="chips">${b.authors_list||(b.authors_l||[]).join('')}${(F.alerts.find(a=>a.ca==ca)?.authors||[]).map(a=>`<span class="chip lav">@${esc(a)}</span>`).join('')}</div>`:''}
 <div class="btns" style="margin-top:14px">${ca?`<a class="btn pri press" target="_blank" href="${esc(d.url||'https://dexscreener.com/solana/'+ca)}">DexScreener</a>`:''}${(b.posts?.[0]||b.post)?`<a class="btn press" target="_blank" href="${esc(b.posts?.[0]||b.post)}">Source post</a>`:''}${ca?`<a class="btn press" target="_blank" href="https://rugcheck.xyz/tokens/${esc(ca)}">RugCheck</a>`:''}</div>`;
 $('#sheet').classList.add('on');$('#scrim').classList.add('on')}
function closeSheet(){$('#sheet').classList.remove('on');$('#scrim').classList.remove('on')}
$('#scrim').onclick=closeSheet;let sy=null;$('#sheet').addEventListener('touchstart',e=>{if($('#sheet').scrollTop<=0)sy=e.touches[0].clientY},{passive:true});$('#sheet').addEventListener('touchend',e=>{if(sy!=null&&e.changedTouches[0].clientY-sy>70)closeSheet();sy=null});
const pick=k=>openSheet(hot.find(h=>(h.ca||h.symbol)==k)||blips.find(h=>(h.ca||h.symbol)==k));
/* ---------- screens ---------- */
function renderRadar(){const a=F.alerts[0];
 $('#heroA').innerHTML=a?`<div class="hero press" onclick="pick('${esc(a.ca)}')"><div class="row"><span class="chip gold">● PINNED ALERT · ${ago(a.time)}</span><span class="badge" style="background:${col(a.score)}">${a.score}/10</span></div><div class="big chromet" style="margin-top:10px">$${esc(a.dex?.symbol)}</div><div class="mu">${esc(a.dex?.name)} · ${(a.authors||[]).length} callers · RugCheck ${a.rug?.risks?.length?a.rug.risks.length+' flags':'clean'}</div><div class="grid" style="grid-template-columns:repeat(3,1fr);margin-bottom:0"><div class="kv"><span class="mu">Liq</span><b>${usd(a.dex?.liq)}</b></div><div class="kv"><span class="mu">FDV</span><b>${usd(a.dex?.fdv)}</b></div><div class="kv"><span class="mu">Vol 1h</span><b>${usd(a.dex?.vol_h1)}</b></div></div></div>`:'';
 $('#hot').innerHTML=hot.map(h=>`<div class="glass hc press" onclick="pick('${esc(h.ca||h.symbol)}')"><div class="row"><span class="tk">${h.symbol?'$'+esc(h.symbol):'<span class="mono" style="font-size:13px">'+esc(short(h.ca))+'</span>'}</span>${h.kind=='alert'?`<span class="badge" style="background:${col(h.score)}">${h.score}</span>`:''}</div><div class="mu" style="margin:6px 0 8px">${h.authors} caller${h.authors>1?'s':''} · ${ago(h.time)}</div><span class="chip ${h.kind=='alert'?'gold':'blue'}">${h.kind=='alert'?'Alert':esc((h.reason||'').replace('only ','').slice(0,18))}</span></div>`).join('')||'<div class="empty">Quiet on the radar.</div>';
 tick()}
function tick(){if(!F)return;const r=F.runs[0];if(!r)return;$('#sLast').textContent=hm(r.time);const s=Math.round(r.time+1200-Date.now()/1e3);$('#sNext').textContent=s>0?Math.floor(s/60)+':'+String(s%60).padStart(2,'0'):'due';$('#sReads').innerHTML=F.stats.x_reads_today+'<small class="mu">/'+F.stats.x_reads_limit+'</small>'}
setInterval(tick,1000);
function chart(runs){const rs=runs.slice(0,12).reverse(),mx=Math.max(1,...rs.map(r=>r.posts||0));return`<div class="chart">${rs.map((r,i)=>`<div class="c"><i style="height:${(r.posts||0)/mx*85}%;background:linear-gradient(var(--lav),rgba(201,182,245,.15));animation-delay:${i*40}ms"></i><i style="height:${(r.unique_cas||0)/mx*85}%;background:linear-gradient(var(--blue),rgba(169,200,240,.15));margin-top:-${(r.unique_cas||0)/mx*85}%;width:45%;opacity:.95;animation-delay:${i*40+120}ms"></i><span class="mu" style="font-size:9px">#${r.id}</span></div>`).join('')}</div><div class="chips"><span class="chip lav">■ Posts</span><span class="chip blue">■ CAs</span></div>`}
function renderScans(){const R=F.runs;$('#s-scans').innerHTML=`<div class="glass"><div class="row"><div><div class="eyebrow">Activity · last ${Math.min(12,R.length)} scans</div><div class="big2 chromet">${R.reduce((s,r)=>s+(r.posts||0),0)}<small class="mu" style="font-size:13px"> posts scanned</small></div></div></div>${chart(R)}</div>
 <div class="h2">Timeline <small>${R.length} scans</small></div><div class="tl">${R.map(r=>`<div class="ti ${r.alerts?'hit':''}"><div class="glass" style="margin:0"><div class="row"><b style="font-family:var(--head)">Scan #${r.id}</b><span class="mu">${tm(r.time)}</span></div><div class="chips"><span class="chip">${r.posts??'—'} posts</span><span class="chip blue">${r.unique_cas??'—'} CAs</span><span class="chip">${r.x_reads??'—'} reads</span>${r.alerts?`<span class="chip gold">★ ${r.alerts} alert</span>`:''}${r.watchlist_pass?'<span class="chip lav">watchlist pass</span>':''}</div>${(r.near_misses||[]).slice(0,4).map(n=>`<div class="nm press" ${n.ca?`onclick="copy('${esc(n.ca)}')"`:''}><span class="mono">${n.symbol?'$'+esc(n.symbol):esc(short(n.ca))}</span><span class="mu" style="text-align:right">${esc(n.reason)}${n.post?` · <a style="color:var(--lav)" href="${esc(n.post)}" target="_blank" onclick="event.stopPropagation()">post</a>`:''}</span></div>`).join('')}</div></div>`).join('')}</div>`}
const TIER={blknoiz06:'KOL',MustStopMurad:'KOL',frankdegods:'KOL',CryptoKaleo:'KOL',notthreadguy:'KOL',inversebrah:'KOL',Pentosh1:'KOL',thedefiedge:'KOL',Cupseyy:'Trader',a1lon9:'Trader',gainzy222:'Trader',theunipcs:'Trader',orangie:'Trader',ratwizardx:'Trader',MoonOverlord:'Trader',Cented7:'Trader',Ga__ke:'Trader',traderpow:'Trader',shahh:'Trader',GiganticRebirth:'Trader','0xSisyphus':'Smart money',lookonchain:'On-chain data',EmberCN:'On-chain data',dexscreener:'Platform',bonk_inu:'Ecosystem'};
const TC={KOL:'gold',Trader:'lav','Smart money':'ok','On-chain data':'blue',Platform:'',Ecosystem:''};
function renderWatch(){const FL=F.followers||{};$('#s-watch').innerHTML=`<div class="glass"><div class="eyebrow">Watchlist</div><div class="big2 chromet">${F.watchlist.length} accounts</div><div class="mu">Their mentions count double toward a spike.</div><div class="chips" style="margin-top:10px">${Object.keys(TC).map(t=>`<span class="chip ${TC[t]}">${t} · ${F.watchlist.filter(u=>(TIER[u]||'Trader')==t).length}</span>`).join('')}</div></div>
 <div class="glass">${F.watchlist.map(u=>{const t=TIER[u]||'Trader',h=hash(u)*360,f=FL[u];return`<a class="acc press" href="https://x.com/${esc(u)}" target="_blank"><span class="av" style="background:linear-gradient(135deg,hsl(${h} 60% 82%),hsl(${h+40} 30% 55%))">${esc(u.replace(/[^A-Za-z]/g,'').slice(0,2).toUpperCase())}</span><span style="flex:1;min-width:0"><b style="font-weight:600">@${esc(u)}</b><br><span class="mu">${f?(f>=1e6?(f/1e6).toFixed(1)+'M':Math.round(f/1e3)+'k')+' followers':'x.com/'+esc(u)}</span></span><span class="chip ${TC[t]}">${t}</span></a>`}).join('')}</div>`}
function renderStats(){const s=F.stats,R=F.runs,sc=F.alerts.map(a=>a.score),bins=[...Array(10)].map((_,i)=>sc.filter(x=>x==i+1).length),mx=Math.max(1,...bins),pct=s.x_reads_today/s.x_reads_limit*100;
 const reasons={};R.forEach(r=>(r.near_misses||[]).forEach(n=>{const k=/author/.test(n.reason)?'Too few callers':/pair/.test(n.reason)&&/no/.test(n.reason)?'No Solana pair':/age/.test(n.reason)?'Too old':/liq/.test(n.reason)?'Low liquidity':/up|late/.test(n.reason)?'Already pumped':'Other';reasons[k]=(reasons[k]||0)+1}));const rt=Object.values(reasons).reduce((a,b)=>a+b,0)||1;
 $('#s-stats').innerHTML=`<div class="grid" style="margin-top:4px"><div class="glass" style="margin:0"><div class="mu">Scans today</div><div class="big2 chromet">${s.scans_today}</div></div><div class="glass" style="margin:0"><div class="mu">Alerts total</div><div class="big2" style="color:var(--gold)">${s.alerts_total}</div></div><div class="glass" style="margin:0"><div class="mu">Coins checked</div><div class="big2 chromet">${s.tracked_cas}</div></div><div class="glass" style="margin:0"><div class="mu">Total scans</div><div class="big2 chromet">${s.total_runs}</div></div></div>
 <div class="glass"><div class="row"><span class="eyebrow">X reads today</span><b>${s.x_reads_today} / ${s.x_reads_limit}</b></div><div class="bar"><i style="width:${Math.max(1.5,pct)}%"></i></div><div class="mu" style="margin-top:6px">${(100-pct).toFixed(1)}% of the daily budget left</div></div>
 <div class="glass"><div class="eyebrow">Score distribution</div><div class="chart" style="height:90px">${bins.map((b,i)=>`<div class="c"><i style="height:${b/mx*80+2}%;background:${b?col(i+1):'rgba(255,255,255,.08)'};animation-delay:${i*40}ms"></i><span class="mu" style="font-size:10px">${i+1}</span></div>`).join('')}</div><div class="mu">Alerts fire at 6+</div></div>
 <div class="glass"><div class="eyebrow" style="margin-bottom:8px">Why coins get dropped</div>${Object.entries(reasons).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div style="margin:8px 0"><div class="row"><span>${k}</span><span class="mu">${v}</span></div><div class="bar"><i style="width:${v/rt*100}%"></i></div></div>`).join('')||'<div class="mu">No data yet</div>'}</div>
 <div class="glass"><div class="row nm" style="border:0"><span class="mu">Scan interval</span><b>~20 min</b></div><div class="row nm"><span class="mu">Alert threshold</span><b>6+/10</b></div><div class="row nm"><span class="mu">Last updated</span><b>${tm(F.updated)} Athens</b></div></div>`}
function show(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.k==tab));document.querySelectorAll('section').forEach(s=>s.classList.toggle('on',s.id=='s-'+tab));$('#ttl').textContent=tabs.find(t=>t[0]==tab)[1];if(tab=='radar')requestAnimationFrame(size)}
function render(){if(!F)return;build();renderRadar();renderScans();renderWatch();renderStats()}

let y0=null,dy=0;addEventListener('touchstart',e=>{if(scrollY<=0&&!$('#sheet').classList.contains('on'))y0=e.touches[0].clientY},{passive:true});
addEventListener('touchmove',e=>{if(y0==null)return;dy=e.touches[0].clientY-y0;$('#ptr').style.height=Math.min(Math.max(dy*.4,0),44)+'px';$('#ptr').textContent=dy>110?'Release to refresh':'Pull to refresh'},{passive:true});
addEventListener('touchend',async()=>{if(y0!=null&&dy>110){buzz();$('#ptr').textContent='Scanning…';await load();toast('Updated')}$('#ptr').style.height=0;y0=null;dy=0});
document.addEventListener('visibilitychange',()=>document.hidden||load());setInterval(load,60000);
show();load();requestAnimationFrame(draw);if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
if(location.search.includes('sheet')){document.getElementById('sheet').style.transition='none';setTimeout(()=>F&&openSheet(hot[0]),900)}
